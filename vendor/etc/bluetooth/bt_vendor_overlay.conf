# This is BTBCM HAL overlay configuration file.

# Uart port name
UartPort = /dev/ttyS1

# Priority of uart type
# HciUartSocket = 0
# SerialUartPort = 1
# SerialAocUartPort = 2
# UserialInvalid = 3
UserialTypePriority = 2-1

# <string> The hardware support which offload capability
BtOffloadCap = AOC

# <string> The BT Offload Trunk Flag Group Name
BtOffloadTrunkGroup = Enabled

# Sar backOff high resolution support
SarBackOffHighResolution = true

# Sar BLE Non-connection support
SarBleNonConnection = true

# Update BQR Event Mask property value
BqrEventMaskValueUpdate = 295262

# Enable BQR engery report logging
BqrEnergyReportLogging = true

BtA2dpOffloadCap = sbc-aac-aptx-aptxhd-ldac-opus

BtOpusEnabled = true

AccelBtDisable = false

ThreadDispatcherEnabled = true

#Enable bthal recovery by restart (b/325998201)
BtHalRecoveryByRestart = true

# Skip unimplemented type packets as a workaround (b/393410375)
SkipUnimplementedPacket = true

# <string> The name of Channel Sounding calibration table
CsCalibrationTableName = CS_25_3
